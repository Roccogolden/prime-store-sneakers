    <script>
      // Abertura: completa na 1ª visita da sessão, curta ao recarregar, nenhuma com "reduzir movimento"
      // ou quando o link já aponta para um tênis (?m=). Se o JS da página falhar, a tela se solta em 7 s.
      (function () {
        try {
          var h = document.documentElement;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (/[?&]m=/.test(location.search)) return;
          var visto = false;
          try {
            visto = sessionStorage.getItem('abertura-vista') === '1';
            sessionStorage.setItem('abertura-vista', '1');
          } catch (e) {}
          var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
          var curta = visto || (nav && nav.type === 'reload');
          h.classList.add('has-intro');
          if (curta) h.classList.add('intro-curta');
          setTimeout(function () {
            h.classList.remove('has-intro', 'intro-curta');
          }, 7000);
        } catch (e) {}
      })();
    </script>

    <link
      rel="preload"
      as="image"
      href="/fotos/p265-720.webp"
      imagesrcset="/fotos/p265-400.webp 400w, /fotos/p265-720.webp 720w, /fotos/p265-1080.webp 1080w"
      imagesizes="(max-width: 767px) 78vw, 420px"
